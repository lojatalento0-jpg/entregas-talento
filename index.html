<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Entregas Talento</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="marca"><img src="logo.png" alt="Talento Construção, Móveis e Decoração"><div class="cont"><b id="contador">0/0</b><span>paradas feitas</span></div></div>
<header class="top">
  <div><span class="brand">Entregas</span><h1 id="titulo">Entregas de hoje</h1><span id="quem" class="sub"></span></div>
  <div id="chips" class="chips"></div>
  <div class="bar"><div id="barra"></div></div>
  <div id="sinal" class="sinal" role="status"></div>
</header>
<main id="main" aria-live="polite"><p class="vazio">Carregando…</p></main>
<div id="login" class="login" hidden></div>
<script>
window.addEventListener('error',function(e){var m=document.getElementById('main');if(m)m.insertAdjacentHTML('afterbegin','<p class="aviso" style="background:#fee2e2;padding:10px;border-radius:10px">Erro no app: '+String(e.message||e).replace(/</g,'&lt;')+' (linha '+(e.lineno||'?')+'). Mande um print disso ao Joabe.</p>');});
window.addEventListener('unhandledrejection',function(e){var m=document.getElementById('main');if(m)m.insertAdjacentHTML('afterbegin','<p class="aviso" style="background:#fee2e2;padding:10px;border-radius:10px">Erro no app: '+String((e.reason&&e.reason.message)||e.reason).replace(/</g,'&lt;')+'. Mande um print disso ao Joabe.</p>');});
</script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
